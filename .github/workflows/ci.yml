name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.17
      - run: uv sync --locked --extra webrtc
      - run: uv run --locked --extra webrtc ruff check src tests scripts
      - run: uv run --locked --extra webrtc ruff format --check src tests scripts
      - run: uv run --locked --extra webrtc pytest -q
      - run: uv run --locked --extra webrtc python -m build
      - run: uv run --locked --extra webrtc twine check --strict dist/*
      - run: uv run --locked --extra webrtc python scripts/check_dist.py
      - run: uv run --locked --extra webrtc python scripts/smoke_wheel.py
      - name: Verify installed wheel over live WebRTC audio
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          OPENAVT_ROOT="$PWD"
          OPENAVT_SMOKE=$(mktemp -d)
          cd "$OPENAVT_SMOKE"
          "$OPENAVT_ROOT/.venv/bin/openavt" live --transport-only --output call
          "$OPENAVT_ROOT/.venv/bin/openavt" live --transport-only --profile pcm --output pcm-call
      - name: Measure five fresh PCM handshakes
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --locked --extra webrtc python scripts/benchmark_handshake.py --runs 5 --profile pcm --output output/ci-perf --require-under-one-second
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: distributions
          path: |
            dist/*
            output/ci-perf/summary.json
