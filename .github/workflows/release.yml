name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.8.17
      - run: uv sync --locked --extra webrtc
      - name: Match release tag to package version
        run: |
          uv run --locked --extra webrtc python - <<'PY'
          import os
          from openavt import __version__
          assert os.environ['GITHUB_REF_NAME'] == f'v{__version__}', 'Tag/version mismatch'
          PY
      - run: uv run --locked --extra webrtc ruff check src tests scripts
      - run: uv run --locked --extra webrtc ruff format --check src tests scripts
      - run: uv run --locked --extra webrtc pytest -q
      - run: uv run --locked --extra webrtc python -m build
      - run: uv run --locked --extra webrtc twine check --strict dist/*
      - run: uv run --locked --extra webrtc python scripts/check_dist.py
      - run: uv run --locked --extra webrtc python scripts/smoke_wheel.py
      - name: Verify installed wheel over live WebRTC audio
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          OPENAVT_ROOT="$PWD"
          OPENAVT_SMOKE=$(mktemp -d)
          cd "$OPENAVT_SMOKE"
          "$OPENAVT_ROOT/.venv/bin/openavt" live --transport-only --output call
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openavt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
