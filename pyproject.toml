[build-system]
requires = ["setuptools>=77.0.3,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "openavt"
dynamic = ["version"]
description = "TLS over voice, built for agents: mutual TLS 1.3 over audio with WebRTC and OpenAI demos"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["tls", "audio", "fsk", "webrtc", "voice-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ketanbj/openavt"
Repository = "https://github.com/ketanbj/openavt"
Issues = "https://github.com/ketanbj/openavt/issues"

[project.optional-dependencies]
audio = ["numpy>=2,<3", "scipy>=1.14,<2"]
webrtc = ["openavt[audio]", "aiortc>=1.15,<2", "av>=14,<18", "python-dotenv>=1.2,<2"]
agents = ["openavt[webrtc]", "openai>=3.28,<4"]

[project.scripts]
openavt = "openavt.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "build>=1.3,<2", "twine>=6,<7", "ruff>=0.14,<1"]

[tool.setuptools.dynamic]
version = {attr = "openavt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
